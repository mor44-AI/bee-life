<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Bee Life" />
    <meta name="theme-color" content="#1a1410" />
    <meta name="description" content="Live the whole life of a Mandaçaia stingless worker bee, from egg to guard of the hive, in a gentle game in English and Portuguese." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bee Life" />
    <meta property="og:description" content="Live the whole life of a Mandaçaia stingless worker bee, from egg to guard of the hive." />
    <meta property="og:image" content="/video/intro-poster.jpg" />
    <title>Bee Life</title>
    <style>
      :root {
        /* Lidas por src/ui/layout.js (readSafeArea) - notch/barra de gestos. */
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        background: #1a1410;
      }

      #game-canvas {
        display: block;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
    </style>
  </head>
  <body oncontextmenu="return false">
    <canvas id="game-canvas"></canvas>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
